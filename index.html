<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101820">
<meta name="description" content="きみのいない夏 — PHSから過去につながる短編ミステリー">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>きみのいない夏</title>
<style>
:root{color-scheme:dark;--bg:#101820;--panel:#17232b;--line:#52636b;--lcd:#b9c9a2;--ink:#17251e;--muted:#a9b8b4;--accent:#d6dfc0}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 10%,#283943 0,#101820 58%);color:#edf0e9;font-family:ui-sans-serif,system-ui,-apple-system,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;min-height:100svh}
button{font:inherit;cursor:pointer}.app{width:min(100%,520px);min-height:100svh;margin:auto;padding:env(safe-area-inset-top) 18px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 2px 12px;color:var(--muted);font-size:12px;letter-spacing:.08em}
.brand{font-weight:700;color:#e6eadf;letter-spacing:.14em}.chapter{border:1px solid #52636b;border-radius:99px;padding:5px 10px}
.device-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:6px 0 14px}
.phone{width:min(100%,390px);background:linear-gradient(145deg,#d5d7d0,#747e7b 28%,#303b3d 29%,#202a2e 100%);border:1px solid #82908a;border-radius:34px;padding:17px 15px 18px;box-shadow:0 22px 60px #0009,inset 0 1px 2px #fff8}
.speaker{width:68px;height:5px;border-radius:10px;background:#182125;margin:0 auto 13px;box-shadow:0 1px 1px #fff5}
.screen{background:linear-gradient(145deg,#c7d3b0,#9eaf8d);border:7px solid #263135;border-radius:8px;min-height:370px;color:var(--ink);padding:12px 12px 14px;box-shadow:inset 0 0 18px #44563a55;display:flex;flex-direction:column;position:relative}
.status{display:flex;justify-content:space-between;font:11px ui-monospace,monospace;border-bottom:1px solid #65775d;padding-bottom:6px}
.signal{letter-spacing:2px}.screen-title{font-size:12px;letter-spacing:.16em;text-align:center;margin:15px 0 10px;opacity:.75}
.caller{font-size:26px;font-weight:800;text-align:center;letter-spacing:.05em;margin:10px 0 5px}
.call-state{text-align:center;font-size:11px;letter-spacing:.12em;margin-bottom:12px}
.message{font-size:15px;line-height:1.9;white-space:pre-wrap;min-height:112px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 2px}
.choices{display:grid;gap:7px;margin-top:auto}
.choice{background:#dce5c9;border:1px solid #63765b;border-radius:4px;color:#203026;padding:11px 10px;text-align:left;font-size:13px;box-shadow:0 2px 0 #65765c}
.choice:active{transform:translateY(1px);box-shadow:none}
.choice small{opacity:.65;margin-right:7px;font-family:ui-monospace,monospace}
.keys{display:flex;justify-content:center;gap:20px;margin:15px 0 0}
.key{width:48px;height:28px;border-radius:14px;background:linear-gradient(#687578,#283438);border:1px solid #9aa29c;box-shadow:0 3px 0 #111b1e}
.key.center{width:76px}
.device-label{text-align:center;color:#c4ccc4;font-size:9px;letter-spacing:.3em;margin-top:9px}
.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0 12px}
.tool{background:#1d2a32;border:1px solid #46565e;color:#dfe6dc;border-radius:99px;padding:9px 14px;font-size:12px}
.tool:active{background:#30424b}
.footer{text-align:center;color:#809098;font-size:10px;line-height:1.7;padding-bottom:8px}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:22px;z-index:5}
.modal.open{display:flex}.dialog{width:min(100%,400px);background:#17232b;border:1px solid #64737a;border-radius:14px;padding:20px;box-shadow:0 20px 70px #000}
.dialog h2{font-size:16px;margin:0 0 12px}.dialog p{font-size:13px;line-height:1.8;color:#c8d1cc}.dialog button{margin-top:8px}
@media(max-height:720px){.screen{min-height:330px}.message{min-height:85px}.phone{padding-top:12px}.device-wrap{padding:0}}
</style>
</head>
<body>
<main class="app">
  <header class="top"><div class="brand">NATSUNAGI / 1999</div><div class="chapter" id="chapter">PROLOGUE</div></header>
  <section class="device-wrap">
    <div class="phone" aria-label="PHS風ゲーム画面">
      <div class="speaker"></div>
      <div class="screen">
        <div class="status"><span id="clock">1999/08/11 WED</span><span class="signal">▂▄▆ ▣</span></div>
        <div class="screen-title" id="screenTitle">着信履歴</div>
        <div class="caller" id="caller">非通知</div>
        <div class="call-state" id="callState">INCOMING CALL</div>
        <div class="message" id="message">古いPHSが、鳴っている。</div>
        <div class="choices" id="choices">
          <button class="choice" data-choice="start"><small>▶</small>通話に出る</button>
        </div>
      </div>
      <div class="keys"><div class="key"></div><div class="key center"></div><div class="key"></div></div>
      <div class="device-label">NATSUNAGI PHS · PERSONAL HANDY PHONE</div>
    </div>
  </section>
  <nav class="controls">
    <button class="tool" id="saveBtn">記録する</button>
    <button class="tool" id="loadBtn">記録を読む</button>
    <button class="tool" id="historyBtn">着信履歴</button>
    <button class="tool" id="resetBtn">最初から</button>
  </nav>
  <footer class="footer">この物語はフィクションです。<br>選択によって、記憶と着信履歴が少しずつ変化します。</footer>
</main>
<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="dialog"><h2 id="modalTitle">記録</h2><p id="modalText"></p><button class="tool" id="modalClose">閉じる</button></div>
</div>
<script>
const scenes = {
 start:{date:"2026/08/11 TUE",chapter:"PROLOGUE",title:"発信元不明",caller:"非通知",state:"INCOMING CALL",text:"実家の押し入れで見つけた、古いPHS。\\n電源が入るはずもない。\\n\\nそれなのに、着信音が鳴っている。",choices:[["通話に出る","answer"],["着信を切る","decline"]]},
 decline:{date:"2026/08/11 TUE",chapter:"PROLOGUE",title:"不在着信",caller:"非通知",state:"MISSED CALL",text:"着信は止まった。\\n画面には、見覚えのない日付が一瞬だけ浮かぶ。\\n\\n1999.08.11",choices:[["履歴を確認する","history"],["もう一度、通話に出る","answer"]]},
 answer:{date:"1999/08/11 WED",chapter:"CHAPTER 01",title:"通話中",caller:"？？？",state:"CONNECTED 00:01",text:"「もしもし？」\\n\\n聞き覚えのある声。\\n子どもの頃の自分が、息をのむ。\\n\\n「……やっと出た。明日の約束、覚えてる？」",choices:[["「誰なの？」","who"],["「明日の約束って？」","promise"],["「君は、いつの人？」","when"]]},
 who:{date:"1999/08/11 WED",chapter:"CHAPTER 01",title:"通話中",caller:"？？？",state:"CONNECTED 00:38",text:"「ひどいな。毎日話してるのに」\\n\\n相手は笑った。\\nその笑い声だけが、記憶の奥に引っかかる。",choices:[["名前を聞く","name"],["明日の約束を聞く","promise"]]},
 promise:{date:"1999/08/11 WED",chapter:"CHAPTER 01",title:"通話中",caller:"？？？",state:"CONNECTED 00:52",text:"「8月12日。いつもの場所で」\\n\\n「今度こそ、みんなで会おう」\\n\\n“みんな”の中に、誰がいたのか思い出せない。",choices:[["「誰が来るの？」","whoWas"],["「わかった」","agree"]]},
 when:{date:"1999/08/11 WED",chapter:"CHAPTER 01",title:"通話中",caller:"？？？",state:"CONNECTED 01:04",text:"長い沈黙。\\n\\n「1999年だよ。そっちは？」\\n\\n相手は、こちらの質問の意味が分からないようだった。",choices:[["「こっちは2026年」","future"],["話を合わせる","agree"]]},
 name:{date:"1999/08/11 WED",chapter:"CHAPTER 01",title:"通話中",caller:"？？？",state:"CONNECTED 01:21",text:"「名前？」\\n\\n相手は答えかけて、やめた。\\n\\n「明日、会えばわかるよ」",choices:[["明日の場所を聞く","place"],["通話を終える","endCall"]]},
 whoWas:{date:"1999/08/11 WED",chapter:"CHAPTER 01",title:"通話中",caller:"？？？",state:"CONNECTED 01:36",text:"「いつもの4人」\\n\\nそう言ったあと、相手は小さく付け足した。\\n\\n「……君も入れて、4人」",choices:[["「僕を入れて？」","self"],["「明日、行くよ」","agree"]]},
 agree:{date:"1999/08/11 WED",chapter:"CHAPTER 01",title:"通話終了",caller:"通話終了",state:"CALL ENDED",text:"「じゃあ、また明日」\\n\\n通話が切れた。\\n\\nPHSの画面に、短いメッセージが届いている。\\n\\n『8月12日を忘れないで』",choices:[["メッセージを開く","message"],["着信履歴を見る","history"]]},
 future:{date:"1999/08/11 WED",chapter:"CHAPTER 01",title:"通話中",caller:"？？？",state:"SIGNAL LOST",text:"「……何言ってるの？」\\n\\nノイズが走る。\\n通話の向こうで、誰かが別の声で言った。\\n\\n「まだ、言っちゃだめだ」",choices:[["声の主を問い詰める","voice"],["通話を続ける","endCall"]]},
 place:{date:"1999/08/11 WED",chapter:"CHAPTER 01",title:"通話中",caller:"？？？",state:"CONNECTED 01:58",text:"「川沿いの公衆電話。覚えてるでしょ」\\n\\nそこは、今も街に残っている場所だ。\\nただし、電話ボックスは数年前に撤去されている。",choices:[["「そこで待ってる」","agree"],["「そこには行けない」","endCall"]]},
 self:{date:"1999/08/11 WED",chapter:"CHAPTER 01",title:"通話中",caller:"？？？",state:"CONNECTED 02:03",text:"「そうだよ。君がいないと、始まらない」\\n\\nその言葉に、なぜか胸が痛んだ。",choices:[["明日の約束をする","agree"],["「僕は誰なんだ？」","identity"]]},
 voice:{date:"1999/08/11 WED",chapter:"CHAPTER 01",title:"通話中",caller:"？？？",state:"DISCONNECTED",text:"「聞こえた？」\\n\\n相手の声が急に遠くなる。\\n\\n「その声を、覚えておいて」\\n\\n通話が切れた。",choices:[["履歴を確認する","history"],["もう一度かける","endCall"]]},
 identity:{date:"1999/08/11 WED",chapter:"CHAPTER 01",title:"通話中",caller:"？？？",state:"CONNECTED 02:17",text:"「それは、明日わかるよ」\\n\\n相手はそう答えた。\\n\\n「忘れないで。今度は、ちゃんと」",choices:[["明日の約束をする","agree"],["通話を切る","endCall"]]},
 endCall:{date:"1999/08/11 WED",chapter:"CHAPTER 01",title:"通話終了",caller:"通話終了",state:"CALL ENDED",text:"通話が切れた。\\n\\n画面に表示された通話時間は、03:42。\\n\\n着信履歴の日付は、1999年8月11日。",choices:[["着信履歴を見る","history"],["画面を閉じる","message"]]},
 history:{date:"2026/08/11 TUE",chapter:"PROLOGUE",title:"着信履歴",caller:"1999/08/11",state:"UNKNOWN NUMBER",text:"履歴には、さっきの通話が残っている。\\n\\n発信元：登録なし\\n日時：1999年8月11日\\n通話時間：03:42\\n\\nありえない。けれど、消すことができない。",choices:[["最初の通話に戻る","answer"],["メッセージを確認する","message"]]},
 message:{date:"2026/08/11 TUE",chapter:"PROLOGUE",title:"受信メッセージ",caller:"MESSAGE",state:"NEW MESSAGE",text:"『明日、8月12日。\\nいつもの場所で。\\n今度こそ、忘れないで。』\\n\\n差出人の欄は空白だった。",choices:[["もう一度、PHSを見る","finale"],["着信履歴を確認する","history"]]},
 finale:{date:"2026/08/12 WED",chapter:"CHAPTER 01",title:"翌日",caller:"非通知",state:"NEW INCOMING CALL",text:"翌日。午前2時17分。\\n\\nまた着信があった。\\n\\n今度は、相手の声が少し違う。\\n\\n「ねえ。昨日の電話、誰と話してたの？」",choices:[["「君だよ」","loopEnd"],["「わからない」","loopEnd"],["電話に出ない","loopEnd"]]},
 loopEnd:{date:"1999/08/12 WED",chapter:"CHAPTER 01",title:"記録完了",caller:"UNKNOWN",state:"TO BE CONTINUED",text:"通話の向こうで、蝉の声がした。\\n\\nその夏のことを、あなたはまだ何も知らない。\\n\\n—— CHAPTER 01 END ——",choices:[["最初から読み直す","start"]]}
};
let current="start", choicesMade=[];
const $=id=>document.getElementById(id);
function render(id){
 current=id; const s=scenes[id];
 $("clock").textContent=s.date; $("chapter").textContent=s.chapter; $("screenTitle").textContent=s.title;
 $("caller").textContent=s.caller; $("callState").textContent=s.state; $("message").textContent=s.text;
 $("choices").innerHTML="";
 s.choices.forEach(([label,next],i)=>{const b=document.createElement("button");b.className="choice";b.innerHTML=`<small>${String(i+1).padStart(2,"0")}</small>${label}`;b.addEventListener("click",()=>{choicesMade.push({from:id,to:next,label});render(next)});$("choices").appendChild(b)});
}
function modal(title,text){$("modalTitle").textContent=title;$("modalText").textContent=text;$("modal").classList.add("open")}
$("modalClose").onclick=()=>$("modal").classList.remove("open");
$("saveBtn").onclick=()=>{localStorage.setItem("natsunagi-save",JSON.stringify({current,choicesMade}));modal("記録しました","この端末のブラウザに進行状況を保存しました。")};
$("loadBtn").onclick=()=>{const data=localStorage.getItem("natsunagi-save");if(!data){modal("記録がありません","まだ保存データがありません。");return}const d=JSON.parse(data);choicesMade=d.choicesMade||[];render(d.current||"start");modal("記録を読み込みました","前回の続きから再開します。")};
$("historyBtn").onclick=()=>render("history");
$("resetBtn").onclick=()=>{if(confirm("最初から読み直しますか？ 保存データは残ります。")){choicesMade=[];render("start")}};
if("serviceWorker" in navigator && location.protocol.startsWith("http"))navigator.serviceWorker.register("./sw.js").catch(()=>{});
render("start");
</script>
</body>
</html>
